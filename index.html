<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Apex Drive</title>
<style>

<canvas id="c"></canvas>

<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=960,H=540;cv.width=W;cv.height=H;
const segLen=200,roadW=2200,camH=1100,camDepth=1/Math.tan(50*Math.PI/180),drawN=240,RB=3,playerZ=camH*camDepth,maxSpeed=13000,LAPS=3;
const FOG=[207,227,242],clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;

const PAL=[{grass:[56,138,50],road:[70,70,76],rum:[205,35,38],lane:null},{grass:[48,126,44],road:[75,75,81],rum:[240,240,240],lane:[236,236,236]}],
FIN={grass:[56,138,50],road:[235,235,235],rum:[30,30,30],lane:null};
const segs=[];let N,L;
const lastY=()=>segs.length?segs[segs.length-1].p2.world.y:0;
function add(curve,y){const n=segs.length,l=lastY(),m=()=>({world:{},screen:{},camera:{}});
 segs.push({index:n,p1:{world:{y:l,z:n*segLen},screen:{},camera:{}},p2:{world:{y,z:(n+1)*segLen},screen:{},camera:{}},curve,cars:[],spr:[],pal:PAL[Math.floor(n/RB)%2]});}
function road(e,h,l,c,y){const s=lastY(),t=e+h+l,ey=s+y*segLen;

 for(let n=0;n<l;n++)add(eIO(c,0,n/l),eIO(s,ey,(e+h+n)/t));}

road(50,50,50,0,-lastY()/segLen);
N=segs.length;L=N*segLen;finI=N-70;finZ=finI*segLen;segs[finI].pal=segs[finI+1].pal=segs[8].pal=segs[9].pal=FIN;
{let a=0,x=0,y=0,tc=0;segs.forEach(s=>tc+=s.curve);const k=.012;segs.forEach(s=>{MP.push([x,y]);a+=s.curve*k;x+=Math.cos(a);y+=Math.sin(a);});
 let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;MP.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);});
 const sc=Math.min(130/(x1-x0),90/(y1-y0));MP.forEach(p=>{p[0]=(p[0]-x0)*sc+10;p[1]=(p[1]-y0)*sc+10;});}
for(let i=12;i<N;i++){
 if(i%4===0){const s=Math.random()<.5?-1:1;segs[i].spr.push({t:'t',o:s*(1.5+Math.random()*3),z:.7+Math.random()*.6});}
 if(i%7===2){const s=Math.random()<.5?-1:1;segs[i].spr.push({t:'b',o:s*(1.3+Math.random()*1.5),z:.5+Math.random()*.4});}}
function resetPacks(){segs.forEach(s=>s.spr.forEach(o=>{if(o.t==='h')o.taken=0}))}
for(let i=60;i<finI-30;i+=60+lv*8)segs[i].spr.push({t:'h',o:[-.67,0,.67][(i/7|0)%3],z:1});
segs[9].spr.push({t:'g',o:0,z:1,txt:'START'});segs[finI+1].spr.push({t:'g',o:0,z:1,txt:'FINISH'});}

const COL=[[30,90,200],[236,236,240],[22,22,26],[222,172,20],[40,150,80],[150,40,160],[205,95,25]];
const cars=[];function spawn(){cars.length=0;const n=10+lv*3;for(let i=0;i<n;i++)cars.push({z:3000+rnd()*(finZ-3600),o:[-.67,0,.67][i%3],s:maxSpeed*(.2+rnd()*(.2+lv*.02)),c:COL[i%COL.length],k:i%5===0?1:0});}spawn();
let heal=0,trav=0,lastL=0,dmg=0,warn=0,ot=0,pos=0,speed=0,px=0,state='menu',cd=3.5,lap=1,lapT=0,tot=0,best=0,shake=0,cool=0,sk=0,time=0;
const K={};
addEventListener('keydown',e=>{K[e.code]=1;if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();audio();if(state==='menu'||(canGo()&&(e.code==='Enter'||e.code==='KeyR')))start();if(e.code==='KeyM')mute=!mute});
addEventListener('keyup',e=>K[e.code]=0);
cv.addEventListener('pointerdown',()=>{audio();if(canGo())start()});
document.querySelectorAll('#tc button').forEach(b=>{const k=b.dataset.k,n={l:'ArrowLeft',r:'ArrowRight',u:'ArrowUp',b:'ArrowDown'}[k];
 b.addEventListener('pointerdown',e=>{K[n]=1;audio();if(canGo())start()});['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>K[n]=0));});
function begin(l,d){lv=l;dmg0=d;build();spawn();dmg=d;warn=0;heal=0;trav=0;pos=0;speed=0;px=0;state='count';cd=3.5;tot=0;}
function start(){if(state==='clear')begin(lv+1,dmg*.5);else if(state==='over')begin(lv,dmg0);else begin(1,0);}
let ac,osc,gn,mute=false;
function sfx(t){if(!ac||mute)return;const n=ac.currentTime;
 if(t==='crash'){const len=ac.sampleRate*.5|0,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=1800;const v=ac.createGain();v.gain.value=.8;s.connect(f);f.connect(v);v.connect(ac.destination);s.start(n);
  const o=ac.createOscillator(),og=ac.createGain();o.type='sine';o.frequency.setValueAtTime(140,n);o.frequency.exponentialRampToValueAtTime(40,n+.3);og.gain.setValueAtTime(.9,n);og.gain.exponentialRampToValueAtTime(.001,n+.35);o.connect(og);og.connect(ac.destination);o.start(n);o.stop(n+.4);}
 else if(t==='heal'){[660,880,1320].forEach((fr,i)=>{const o=ac.createOscillator(),og=ac.createGain(),t0=n+i*.09;o.type='triangle';o.frequency.value=fr;og.gain.setValueAtTime(.0001,t0);og.gain.exponentialRampToValueAtTime(.25,t0+.02);og.gain.exponentialRampToValueAtTime(.001,t0+.25);o.connect(og);og.connect(ac.destination);o.start(t0);o.stop(t0+.3);});}
 else if(t==='over'){const o=ac.createOscillator(),og=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(320,n+.2);o.frequency.exponentialRampToValueAtTime(50,n+1.1);og.gain.setValueAtTime(.18,n+.2);og.gain.exponentialRampToValueAtTime(.001,n+1.1);o.connect(og);og.connect(ac.destination);o.start(n+.2);o.stop(n+1.2);}}
function audio(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();osc=ac.createOscillator();osc.type='sawtooth';gn=ac.createGain();gn.gain.value=.03;const f=ac.createBiquadFilter();f.frequency.value=500;osc.connect(f);f.connect(gn);gn.connect(ac.destination);osc.start();}catch(e){}}
function hit(sev,ns){dmg+=18+sev*30;speed=Math.min(speed,ns);shake=.8;warn=2.5;cool=.8;sfx('crash');if(dmg>=100){dmg=100;state='over';ot=0;shake=1;sfx('over');}}
function update(dt){
 time+=dt;const sp=speed/maxSpeed,ps=find(pos+playerZ);
 cars.forEach(c=>{c.z=(c.z+dt*c.s)%L});
 if(state==='count'){cd-=dt;if(cd<=0)state='race';}
 if(state==='race'){
  const up=K.ArrowUp||K.KeyW,dn=K.ArrowDown||K.KeyS||K.Space,lf=K.ArrowLeft||K.KeyA,rt=K.ArrowRight||K.KeyD;
  trav+=speed*dt;pos=trav%L;tot+=dt;
  if(trav+playerZ>=finZ+segLen){state=lv>=10?'win':'clear';ot=0;if(!bestT[lv]||tot<bestT[lv])bestT[lv]=tot;sfx('heal');}
  const dx=dt*2*sp;if(lf)px-=dx;if(rt)px+=dx;px-=dx*sp*ps.curve*.32;
  if(up)speed+=maxSpeed/4.2*dt;else if(dn)speed-=maxSpeed*1.1*dt;else speed-=maxSpeed/6*dt;
  if(Math.abs(px)>1.05&&speed>maxSpeed/4)speed-=maxSpeed/1.6*dt;
  px=clamp(px,-2.6,2.6);speed=clamp(speed,0,maxSpeed*(1-dmg/250));
  cool-=dt;
  [0,1,2].forEach(k=>find(pos+playerZ-k*segLen).spr.forEach(s=>{if(s.t==='h'&&!s.taken&&Math.abs(s.o-px)<.42){s.taken=1;dmg=Math.max(0,dmg-35);heal=1.6;warn=0;sfx('heal');}}));
  cars.forEach(c=>{let dz=((c.z-(pos+playerZ))%L+L)%L;if(dz>L/2)dz-=L;
   if(Math.abs(dz)<segLen*.9&&Math.abs(c.o-px)<.34&&speed>c.s&&cool<=0){hit(sp,c.s*.5);px+=(px>=c.o?1:-1)*.08;}});
  if(Math.abs(px)>1.1&&cool<=0)ps.spr.forEach(s=>{if(s.t==='t'&&Math.abs(s.o-px)<.28&&speed>1500){hit(sp,speed*.3);}});
 }else if(state==='clear'||state==='win'||state==='over')speed=Math.max(0,speed-maxSpeed*1.1*dt),trav+=speed*dt,pos=trav%L;
 shake=Math.max(0,shake-dt);ot+=dt;warn=Math.max(0,warn-dt);heal=Math.max(0,heal-dt);

}
function proj(p,cx,cy,cz){const c=p.camera,s=p.screen;c.x=-cx;c.y=p.world.y-cy;c.z=p.world.z-cz;s.scale=camDepth/c.z;s.x=Math.round(W/2+s.scale*c.x*W/2);s.y=Math.round(H/2-s.scale*c.y*H/2);s.w=Math.round(s.scale*roadW*W/2);}

function sky(){
 let gr=g.createLinearGradient(0,0,0,H/2);gr.addColorStop(0,'#3d7fd1');gr.addColorStop(.7,'#9cc7ec');gr.addColorStop(1,'#d7eaf6');g.fillStyle=gr;g.fillRect(0,0,W,H/2+2);
 const sg=g.createRadialGradient(W*.72,H*.27,4,W*.72,H*.27,130);sg.addColorStop(0,'#fffbe8');sg.addColorStop(.15,'#fff3c0');sg.addColorStop(1,'rgba(255,240,180,0)');g.fillStyle=sg;g.fillRect(0,0,W,H/2);
 g.fillStyle='rgba(255,255,255,.75)';for(let i=0;i<6;i++){const x=((i*230+sk*.15+time*6)%1200+1200)%1200-120,y=50+(i*37%90);for(let j=0;j<4;j++){g.beginPath();g.ellipse(x+j*34,y+(j%2)*6,48-j*6,15,0,0,7);g.fill();}}
 [[.25,'#8da9c4',70,.0035,.011],[.6,'#5f7f6e',48,.006,.017]].forEach(([k,col,h,f1,f2],li)=>{g.fillStyle=col;g.beginPath();g.moveTo(0,H/2);const o=sk*k*(li+1);
  for(let x=0;x<=W;x+=8)g.lineTo(x,H/2-(h*.5+h*.35*Math.sin((x-o)*f1+li*2)+h*.2*Math.sin((x-o)*f2+1)));g.lineTo(W,H/2);g.fill();});

}
function tree(x,y,w){g.fillStyle='#4a3320';g.fillRect(x-w*.04,y-w*.22,w*.08,w*.22);

  g.fillStyle='rgba(120,190,110,.18)';g.beginPath();g.moveTo(x,by-ht);g.lineTo(x+h,by);g.lineTo(x+h*.1,by);g.fill();}}

function pack(x,y,w){const b=Math.sin(time*4)*w*.12,yy=y-w*.9-b;g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(x,y,w*.6,w*.12,0,0,7);g.fill();
 const gl=g.createRadialGradient(x,yy,w*.1,x,yy,w*1.2);gl.addColorStop(0,'rgba(60,255,120,.55)');gl.addColorStop(1,'rgba(60,255,120,0)');g.fillStyle=gl;g.fillRect(x-w*1.3,yy-w*1.3,w*2.6,w*2.6);
 g.fillStyle='#17a74a';rr(x-w*.55,yy-w*.55,w*1.1,w*1.1,w*.18);g.fillStyle='#fff';g.fillRect(x-w*.12,yy-w*.38,w*.24,w*.76);g.fillRect(x-w*.38,yy-w*.12,w*.76,w*.24);}
function gate(x,y,w,o){const pw=w*1.2;g.fillStyle='#d8d8dc';g.fillRect(x-pw-w*.05,y-w*1.1,w*.1,w*1.1);g.fillRect(x+pw-w*.05,y-w*1.1,w*.1,w*1.1);
 g.fillStyle='#202428';g.fillRect(x-pw-w*.05,y-w*1.3,pw*2+w*.1,w*.28);const cw=w*.08;for(let i=0;i*cw<pw*2;i++){g.fillStyle=i%2?'#fff':'#111';g.fillRect(x-pw+i*cw,y-w*1.3,cw,w*.07);g.fillStyle=i%2?'#111':'#fff';g.fillRect(x-pw+i*cw,y-w*1.23,cw,w*.07);}if(w>40){g.fillStyle='#fff';g.font='bold '+(w*.12|0)+'px system-ui';g.textAlign='center';g.textBaseline='middle';g.fillText(o.txt,x,y-w*1.08);}}

 g.save();g.translate(x,y);g.rotate(rot||0);
 g.fillStyle='rgba(0,0,0,.45)';g.beginPath();g.ellipse(0,-w*.01,w*.56,w*.07,0,0,7);g.fill();

 g.beginPath();g.moveTo(-w*.38,-bh+1);g.lineTo(-w*.29,-bh-ch);g.lineTo(w*.29,-bh-ch);g.lineTo(w*.38,-bh+1);g.fill();
 gr=g.createLinearGradient(0,-bh-ch,0,-bh);gr.addColorStop(0,'#5d7488');gr.addColorStop(1,'#141c25');g.fillStyle=gr;
 g.beginPath();g.moveTo(-w*.33,-bh-1);g.lineTo(-w*.26,-bh-ch+w*.035);g.lineTo(w*.26,-bh-ch+w*.035);g.lineTo(w*.33,-bh-1);g.fill();

function drawSeg(s,n){const a=s.p1.screen,b=s.p2.screen,P=s.pal,f=s.fog;

function render(){
 const bs=find(pos),bp=(pos%segLen)/segLen,py=lerp(bs.p1.world.y,bs.p2.world.y,bp);

  s.fog=Math.min(1,Math.pow(n/drawN,2.1));s.clip=maxy;
  proj(s.p1,px*roadW-x,py+camH,pos-lp);proj(s.p2,px*roadW-x-dx,py+camH,pos-lp);x+=dx;dx+=s.curve;
